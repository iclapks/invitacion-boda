<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Boda</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  background: #fff8f5;
  color: #333;
  overflow-x: hidden;
}

section {
  padding: 60px 20px;
  text-align: center;
  opacity: 0;
  transform: translateY(40px);
  transition: all 1s ease;
}

section.visible {
  opacity: 1;
  transform: translateY(0);
}

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
              url('https://images.unsplash.com/photo-1529634806980-85c3dd6d34ac');
  background-size: cover;
  color: white;
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 70px;
  margin: 0;
}

h2 {
  font-weight: 300;
}

.btn {
  display: inline-block;
  padding: 15px 30px;
  margin: 10px;
  border-radius: 30px;
  text-decoration: none;
  color: white;
  background: #d4a373;
  transition: 0.3s;
}

.btn:hover {
  background: #b5835a;
}

.countdown {
  font-size: 24px;
  margin-top: 20px;
}

/* GALERÍA */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}

.gallery img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.3s;
}

.gallery img:hover {
  transform: scale(1.05);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 10;
  padding-top: 50px;
  left: 0; top: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.8);
}

.modal img {
  width: 80%;
  max-width: 500px;
}

/* BOTÓN MÚSICA */
.music-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #d4a373;
  color: white;
  border: none;
  padding: 15px;
  border-radius: 50%;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- MÚSICA -->
<audio id="music" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
</audio>

<button class="music-btn" onclick="toggleMusic()">🎵</button>

<!-- HERO -->
<section class="hero visible">
  <h1>César & Yoselin</h1>
  <h2>¡Nos casamos!</h2>
  <p>19 de Septiembre 2026</p>
  <div class="countdown" id="countdown"></div>
</section>

<!-- UBICACIÓN -->
<section>
  <h2>📍 Ubicación</h2>
  <p>Salón Jardín Los Ángeles</p>
  <a class="btn" href="https://maps.google.com" target="_blank">Ver mapa</a>
</section>

<!-- ITINERARIO -->
<section>
  <h2>🕒 Itinerario</h2>
  <p>5:00 PM - Ceremonia</p>
  <p>7:00 PM - Recepción</p>
  <p>9:00 PM - Cena</p>
</section>

<!-- GALERÍA -->
<section>
  <h2>📸 Nuestra historia</h2>
  <div class="gallery">
    <img src="https://images.unsplash.com/photo-1519741497674-611481863552" onclick="openModal(this.src)">
    <img src="https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91" onclick="openModal(this.src)">
    <img src="https://images.unsplash.com/photo-1492724441997-5dc865305da7" onclick="openModal(this.src)">
  </div>
</section>

<!-- CONFIRMACIÓN -->
<section>
  <h2>💖 Confirma tu asistencia</h2>
  <a class="btn" href="https://wa.me/52TU_NUMERO?text=Confirmo%20mi%20asistencia" target="_blank">Sí asistiré</a>
  <a class="btn" href="https://wa.me/52TU_NUMERO?text=No%20podré%20asistir" target="_blank">No asistiré</a>
</section>

<!-- MODAL -->
<div id="modal" class="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>
// ANIMACIÓN SCROLL
const sections = document.querySelectorAll("section");

window.addEventListener("scroll", () => {
  sections.forEach(sec => {
    const top = sec.getBoundingClientRect().top;
    if (top < window.innerHeight - 100) {
      sec.classList.add("visible");
    }
  });
});

// COUNTDOWN
const weddingDate = new Date("Dec 15, 2026 17:00:00").getTime();

setInterval(() => {
  const now = new Date().getTime();
  const d = weddingDate - now;

  const days = Math.floor(d / (1000*60*60*24));
  const hours = Math.floor((d % (1000*60*60*24)) / (1000*60*60));

  document.getElementById("countdown").innerHTML =
    days + " días " + hours + " horas";
}, 1000);

// MÚSICA
function toggleMusic() {
  const music = document.getElementById("music");
  if (music.paused) music.play();
  else music.pause();
}

// GALERÍA MODAL
function openModal(src) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("modalImg").src = src;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
