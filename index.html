<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Boda</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  text-align: center;
  background: #fff8f5;
  color: #333;
}

.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)),
              url('https://images.unsplash.com/photo-1529634806980-85c3dd6d34ac');
  background-size: cover;
  background-position: center;
  color: white;
}

h1 {
  font-family: 'Great Vibes', cursive;
  font-size: 60px;
  margin: 0;
}

h2 {
  font-weight: 300;
}

.section {
  padding: 40px 20px;
}

.btn {
  display: inline-block;
  padding: 15px 25px;
  margin: 10px;
  border-radius: 30px;
  text-decoration: none;
  color: white;
  background: #d4a373;
  transition: 0.3s;
}

.btn:hover {
  background: #b5835a;
}

.countdown {
  font-size: 24px;
  margin-top: 20px;
}

</style>
</head>

<body>

<div class="hero">
  <h1>César & Yoselin</h1>
  <h2>¡Nos casamos!</h2>
  <p>19 de Septiembre 2026</p>
  <div class="countdown" id="countdown"></div>
</div>

<div class="section">
  <h2>📍 Ubicación</h2>
  <p>Parroquia el Señor de la Cañita</p>
  <a class="btn" href="https://maps.app.goo.gl/n96iKex8pFSaLR1o6" target="_blank">Ver en mapa</a>
</div>

<div class="section">
  <h2>🕒 Itinerario</h2>
  <p>5:00 PM - Ceremonia</p>
  <p>7:00 PM - Recepción</p>
  <p>9:00 PM - Cena</p>
</div>

<div class="section">
  <h2>💖 Confirma tu asistencia</h2>
  <a class="btn" href="https://wa.me/529999999999?text=Confirmo%20mi%20asistencia%20a%20la%20boda" target="_blank">Sí asistiré</a>
  <a class="btn" href="https://wa.me/529999999999?text=No%20podré%20asistir" target="_blank">No asistiré</a>
</div>

<div class="section">
  <h2>🎁 Mesa de regalos</h2>
  <p>Tu presencia es nuestro mejor regalo 💕</p>
</div>

<script>
// COUNTDOWN
const weddingDate = new Date("Dec 15, 2026 17:00:00").getTime();

const timer = setInterval(function() {
  const now = new Date().getTime();
  const distance = weddingDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

  document.getElementById("countdown").innerHTML =
    days + " días " + hours + " horas";

  if (distance < 0) {
    clearInterval(timer);
    document.getElementById("countdown").innerHTML = "¡Hoy es el gran día!";
  }
}, 1000);
</script>

</body>
</html>
